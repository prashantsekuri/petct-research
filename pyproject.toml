[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "petct-research"
version = "0.1.0"
description = "Research tooling for inspecting and analysing whole-body PET/CT studies."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nibabel>=5.3,<6",
    "numpy>=2.3,<3",
    "pydicom>=3.0,<4",
    "scipy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
